[package]
name = "ucabled"
version = "0.3.0-pre"
edition = "2024"
# Lowest toolchain the locked dependencies build with (gtk4 0.11 needs 1.92).
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Virtual FIDO2 device that relays WebAuthn ceremonies to a phone via caBLE v2 (hybrid transport)"
repository = "https://github.com/fuzy112/ucabled"
readme = "README.md"
keywords = ["fido2", "passkey", "cable", "webauthn", "bluetooth"]
categories = ["authentication", "os::linux-apis"]

[features]
default = ["ble"]
ble = ["dep:bluer"]
# CTAP 2.3 optional BLE data channel (L2CAP CoC). Experimental: the wire
# framing is not yet verified against real phones, so it is off by default.
l2cap = ["ble", "bluer/l2cap"]
# GNOME-native window chrome via libadwaita. Optional: without it the helper
# uses plain GTK4 and stays desktop-neutral.
adwaita = ["dep:adw"]

# The daemon itself is useless without BLE: its only transaction path goes
# through relay, which is BLE-gated.  Skip the binary in no-ble builds
# instead of letting it fail to compile.
[[bin]]
name = "ucabled"
path = "src/bin/ucabled.rs"
required-features = ["ble"]

[dependencies]
anyhow = "1"
futures = "0.3"
hex = "0.4"
# p256 0.14 is built on rand_core 0.10, so the RNG-facing code tracks the
# rand 0.10 API (`Rng` instead of `RngCore`, no `OsRng` unit struct).
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

p256 = { version = "0.14", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
zeroize = "1"

tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "net",
  "process",
  "io-util",
] }
# `__rustls-tls` rather than `rustls-tls-webpki-roots`: the tunnel always
# dials with its own `Connector::Rustls` config (src/tunnel.rs), so the
# default root store that the public feature builds is never used — and it
# would drag in the vulnerable webpki-roots 0.26 line (RUSTSEC-2026-0381).
tokio-tungstenite = { version = "0.30", features = [
  "__rustls-tls",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
# Mozilla root store for the tunnel's client TLS config (built explicitly so
# the protocol version floor does not depend on rustls's default features).
# 1.0.10 drops the distrusted emSign intermediates (RUSTSEC-2026-0381).
webpki-roots = "1.0.10"
qrcode = { version = "0.14", default-features = false }

bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }
dbus = "0.9"
dbus-crossroads = "0.5"
dbus-tokio = "0.7"
libc = "0.2"

# GTK4 UI helper. The gtk4 crate's library is called `gtk4` and libadwaita's is
# `libadwaita`, so rename them to the conventional `gtk` / `adw` import names.
gtk = { package = "gtk4", version = "0.11" }
# GNOME-native window chrome; enabled through the `adwaita` feature.
adw = { package = "libadwaita", version = "0.9", optional = true }
gtk4-layer-shell = "0.8"
# glibc and musl ship the gettext runtime, so link against it instead of
# letting gettext-sys compile and statically link its bundled GNU gettext
# (which also breaks under the LTO flags Debian's build tools add).
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[dev-dependencies]
proptest = "1"

# Thin LTO for release builds: inlines the pure-Rust crypto and CBOR code
# across crate boundaries for a modest runtime win, while keeping release
# build times and backtrace usefulness reasonable (unlike fat LTO or
# codegen-units = 1).  Dev builds are unaffected.
[profile.release]
lto = "thin"
