<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The daemon only ever calls: the bus driver (name ownership, uid
       lookup, match rules), polkit (CheckAuthorization), BlueZ (BLE
       scan/advertise; also covers systems where bluetooth.conf restricts
       org.bluez to a group), and the session agents, which own unique
       names only and are therefore matched by interface. Signals and
       requested replies are already allowed by the default policy, so
       only method calls are opened here. -->
  <policy user="ucabled">
    <allow own="org.ucabled"/>
    <allow send_destination="org.freedesktop.DBus" send_type="method_call"/>
    <allow send_destination="org.freedesktop.PolicyKit1" send_type="method_call"/>
    <allow send_destination="org.bluez" send_type="method_call"/>
    <allow send_interface="org.ucabled.Agent1" send_type="method_call"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ucabled"/>
  </policy>
</busconfig>
