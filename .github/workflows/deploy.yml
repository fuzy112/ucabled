name: Deploy website

# The website source lives on the "website" branch.  A push there builds
# the Vite app and publishes dist/ to GitHub Pages through the Pages
# artifact flow, so no build output is ever committed.
on:
  push:
    branches: ["website"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload the site
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
