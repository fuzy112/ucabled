name: Release

# A pushed v* tag (created signed, by admin/release.sh) publishes the
# GitHub release.  The job re-verifies that tag, manifest and changelogs
# agree and that the tag carries a valid signature before publishing.
# No binary tarballs: nix-built binaries link against /nix/store and are
# not portable to other distributions, so the release initially carries
# the changelog notes plus GitHub's automatic source archives (regenerated
# on demand, bytes not guaranteed stable, unsigned); admin/release-debs.sh
# then uploads the signed source tarball and Debian packages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Check tag, manifest and changelog agree
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=${TAG#v}
        grep -q "^version = \"$version\"\$" Cargo.toml \
          || { echo "Cargo.toml version does not match $TAG"; exit 1; }
        grep -q "^## \[$version\] - [0-9]" CHANGELOG.md \
          || { echo "CHANGELOG.md has no '## [$version] - <date>' section"; exit 1; }
        head -n1 debian/changelog | grep -q "^ucabled ($version) " \
          || { echo "debian/changelog top entry does not match $TAG"; exit 1; }
        ! head -n1 debian/changelog | grep -q UNRELEASED \
          || { echo "debian/changelog top entry is still UNRELEASED"; exit 1; }
        [ "$(git cat-file -t "$TAG")" = tag ] \
          || { echo "$TAG is a lightweight tag; create it with git tag -s"; exit 1; }

    - name: Verify the tag signature
      env:
        TAG: ${{ github.ref_name }}
        EXPECTED_FPR: ${{ vars.RELEASE_KEY_FPR }}
      run: |
        set -euo pipefail
        # The pubkey in the tagged tree is only the vehicle for the check;
        # the trust anchor is the RELEASE_KEY_FPR repository variable,
        # which someone with mere push access cannot change.  The repo
        # admin must additionally enable tag protection for v* (Settings →
        # Tags), so a pushed tag cannot be moved or replaced afterwards.
        [ -n "$EXPECTED_FPR" ] \
          || { echo "repository variable RELEASE_KEY_FPR is not set"; exit 1; }
        gpg --batch --import .github/release-signing-key.asc
        # Split the tag object into the signed payload and the signature,
        # then verify with gpg directly: VALIDSIG reports the fingerprint
        # of the (sub)key that actually made the signature.
        git cat-file tag "$TAG" > tag-object
        sig_line=$(grep -n '^-----BEGIN PGP SIGNATURE-----$' tag-object | cut -d: -f1)
        head -n "$((sig_line - 1))" tag-object > tag-payload
        tail -n "+$sig_line" tag-object > tag-signature
        status=$(gpg --batch --status-fd=1 --verify tag-signature tag-payload)
        # VALIDSIG field 3 is the key that made the signature (a signing
        # subkey, if one is used); an optional trailing field is the primary
        # key's fingerprint.  Accept either as the release key, so a routine
        # switch to a signing subkey does not break every release.
        line=$(printf '%s\n' "$status" \
          | awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $3, (NF >= 14 ? $NF : $3); exit }')
        [ -n "$line" ] || { echo "no VALIDSIG status from gpg"; exit 1; }
        fpr=${line% *}
        primary=${line#* }
        if [ "$fpr" != "$EXPECTED_FPR" ] && [ "$primary" != "$EXPECTED_FPR" ]; then
          echo "tag signed by unexpected key $fpr (primary $primary, want $EXPECTED_FPR)"
          exit 1
        fi
        echo "tag signature by $fpr (primary $primary) matches RELEASE_KEY_FPR"

    - name: Extract the changelog section
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=${TAG#v}
        awk -v v="$version" '
          $0 ~ "^## \\[" v "\\] - " { found=1; next }
          found && /^## \[/ { exit }
          found && /^\[/ { exit }
          found && NF { body=1 }
          body { print }
        ' CHANGELOG.md > release-notes.md
        [ -s release-notes.md ] || { echo "empty changelog section for $TAG"; exit 1; }
        cat release-notes.md

    - name: Publish the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --verify-tag \
          --title "ucabled ${TAG#v}" \
          --notes-file release-notes.md
