name: Release

# A pushed v* tag (created signed, by admin/release.sh) publishes the
# GitHub release.  The job re-verifies that tag, manifest and changelog
# agree and that the tag carries a valid signature before publishing.
# No binary tarballs: nix-built binaries link against /nix/store and are
# not portable to other distributions, so the release carries the
# changelog notes plus GitHub's automatic source archives.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Check tag, manifest and changelog agree
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=${TAG#v}
        grep -q "^version = \"$version\"\$" Cargo.toml \
          || { echo "Cargo.toml version does not match $TAG"; exit 1; }
        grep -q "^## \[$version\] - [0-9]" CHANGELOG.md \
          || { echo "CHANGELOG.md has no '## [$version] - <date>' section"; exit 1; }
        [ "$(git cat-file -t "$TAG")" = tag ] \
          || { echo "$TAG is a lightweight tag; create it with git tag -s"; exit 1; }

    - name: Verify the tag signature
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        gpg --batch --import .github/release-signing-key.asc
        git tag -v "$TAG"

    - name: Extract the changelog section
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=${TAG#v}
        awk -v v="$version" '
          $0 ~ "^## \\[" v "\\] - " { found=1; next }
          found && /^## \[/ { exit }
          found && /^\[/ { exit }
          found && NF { body=1 }
          body { print }
        ' CHANGELOG.md > release-notes.md
        [ -s release-notes.md ] || { echo "empty changelog section for $TAG"; exit 1; }
        cat release-notes.md

    - name: Publish the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --verify-tag \
          --title "ucabled ${TAG#v}" \
          --notes-file release-notes.md
