name: Rust

on:
  push:
    # next is the experimental branch; it publishes to the same cache so
    # testers can substitute instead of building.
    branches: ["master", "next"]
    # Only run when something the checks consume changes.  package.nix
    # limits its src to the same set, so a commit elsewhere (docs, site)
    # cannot change the output path and its Cachix entry stays valid.
    # Keep in sync with nix/package.nix and the pull_request filter below.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - "nix/**"
      - "po/**"
      - "dist/**"
      - "admin/check-po.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: ["master"]
    # The same filter as on push above.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - "nix/**"
      - "po/**"
      - "dist/**"
      - "admin/check-po.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read
  # The seen job lists earlier runs of this workflow.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A commit that already passed this workflow on another branch (say next,
  # now fast-forwarded to master) needs no re-run: the checks are identical
  # and the artifact is already in the shared Cachix cache.  Only earlier
  # push runs count — a pull request run never publishes — and an explicit
  # workflow_dispatch always runs.
  seen:
    name: Skip already-tested commits
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
    - name: Look for a successful push run of this commit
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        skip=false
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          wid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.workflow_id == $wid and .id != $GITHUB_RUN_ID)] | length")
          [ "$found" -eq 0 ] || skip=true
        fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test

    needs: seen
    if: needs.seen.outputs.skip != 'true'

    # Pinned rather than ubuntu-latest.  The flake supplies every dependency,
    # so the image only matters through the host tools Nix itself needs.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    # The flake carries the dependencies the package and the development
    # shell need, gtk4-layer-shell among them, so CI builds in the same
    # environment a developer uses instead of assembling one of its own.
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # Keep the declared MSRV honest: the toolchain the shell pins must never
    # be older than the minimum Cargo.toml promises.
    - name: Check the MSRV declaration
      run: |
        set -euo pipefail
        declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
        [ -n "$declared" ] || { echo "Cargo.toml has no rust-version"; exit 1; }
        have=$(nix develop --command rustc --version | awk '{print $2}')
        oldest=$(printf '%s\n%s\n' "$declared" "$have" | sort -V | head -n1)
        [ "$oldest" = "$declared" ] \
          || { echo "toolchain $have is older than the declared MSRV $declared"; exit 1; }

    - name: Build the package
      run: nix build .#ucabled -L

    # Flake checks cover the package build (including its tests), cargo fmt,
    # cargo clippy and cargo doc, matching what a developer can run locally.
    # The package itself is already built and cached by the steps above.
    - name: Run flake checks
      run: nix flake check -L

    # Feature combinations are not flake outputs, so they stay plain cargo.
    - name: Check without default features
      run: nix develop --command cargo check --locked --no-default-features --all-targets

    - name: Check the libadwaita feature
      run: nix develop --command cargo check --locked --features adwaita

    # The l2cap tests are feature-gated, so a plain `cargo test` never
    # compiles them; run them here.  The hardware-independent fallback test
    # runs everywhere, the two-device ones stay ignored without a peer.
    - name: Test the experimental l2cap feature
      run: nix develop --command cargo test --locked --features l2cap

    # Catch a helper string that was added without regenerating the catalogs
    # (it would silently fall back to English).
    - name: Check the translation catalogs
      run: nix develop --command admin/check-po.sh

    # Publish only once every check above has passed, so a broken revision is
    # never cached.  Only a push to master or next publishes; a pull request
    # must never be able to sign and serve its own artifact to everyone else.
    - name: Publish to Cachix
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next')
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: nix run nixpkgs#cachix -- push ucabled "$(nix build .#ucabled --no-link --print-out-paths)"
