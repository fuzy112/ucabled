name: Rust

on:
  push:
    # next is the experimental branch; it publishes to the same cache so
    # testers can substitute instead of building.
    branches: ["master", "next"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test

    # Pinned rather than ubuntu-latest.  The flake supplies every dependency,
    # so the image only matters through the host tools Nix itself needs.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    # The flake carries the dependencies the package and the development
    # shell need, gtk4-layer-shell among them, so CI builds in the same
    # environment a developer uses instead of assembling one of its own.
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Build the package
      run: nix build .#ucabled -L

    # Only a push to master or next publishes.  A pull request must never be
    # able to have its own artifact signed and served to everyone else.
    - name: Publish to Cachix
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next')
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: nix run nixpkgs#cachix -- push ucabled "$(nix build .#ucabled --no-link --print-out-paths)"

    # Flake checks cover the package build (including its tests), cargo fmt
    # and cargo clippy, matching what a developer can run locally.  The
    # package itself is already built and cached by the steps above.
    - name: Run flake checks
      run: nix flake check -L

    # Feature combinations are not flake outputs, so they stay plain cargo.
    - name: Check without default features
      run: nix develop --command cargo check --locked --no-default-features --all-targets

    - name: Check the libadwaita feature
      run: nix develop --command cargo check --locked --features adwaita

    - name: Check the experimental l2cap feature
      run: nix develop --command cargo check --locked --features l2cap
