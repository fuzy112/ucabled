name: Audit

# Dependency advisory scanning: on manifest/lockfile changes, weekly (a crate
# we pin can gain a known vulnerability between commits), and on demand.  The
# schedule only fires on the default branch.
on:
  push:
    branches: ["master", "next"]
    paths: ["Cargo.lock", "Cargo.toml", "deny.toml"]
  # Catch a vulnerable dependency in the pull request, before it merges.
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", "deny.toml"]
  schedule:
    - cron: "24 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # The advisory database is fetched over the network at run time; the
    # scanner itself comes from the flake-locked dev shell, not the registry.
    - name: Audit the locked dependencies
      run: nix develop --command cargo audit

    # License, source and ban policy on top of the advisory database; the
    # rules live in deny.toml.
    - name: Check the dependency policy
      run: nix develop --command cargo deny check
